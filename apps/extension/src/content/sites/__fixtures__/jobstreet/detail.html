<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<title>Product Designer Job in Jakarta Selatan, Jakarta Raya - Jobstreet</title>
	</head>
	<body>
		<header><a data-automation="jobstreet" href="/">Jobstreet</a></header>
		<div data-automation="splitViewJobDetailsWrapper">
			<div data-automation="jobDetailsPage">
				<div data-automation="advertiser-logo"><img src="https://image-service.example/logos/lumen.png" alt="" /></div>
				<img src="data:image/png;base64,AAAA" alt="Lumen Health logo" />
				<h1 data-automation="job-detail-title">Product Designer</h1>
				<span data-automation="advertiser-name">Lumen Health</span>

				<span data-automation="job-detail-classifications"><a href="#">Desain &amp; Arsitektur</a></span>
				<span data-automation="job-detail-work-type"><a href="#">Full time</a></span>
				<span data-automation="job-detail-salary">Rp 15.000.000 – Rp 20.000.000 per month</span>
				<div>
					<a data-automation="job-detail-apply" href="/id/job/81234567/apply">Lamar cepat</a
					><button type="button" data-automation="signed-out-save-job">Simpan</button>
				</div>
				<div data-automation="jobAdDetails">
					<div>
						<p><strong>Tentang peran ini</strong></p>
						<ul>
							<li>Merancang alur pendaftaran pasien.</li>
							<li>Riset bersama perawat.</li>
						</ul>
					</div>
				</div>
			</div>
		</div>

</html>
