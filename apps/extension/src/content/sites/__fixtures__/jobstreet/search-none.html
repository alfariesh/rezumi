<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<title>Lowongan Kerja Designer di Jakarta Raya | Jobstreet</title>
	</head>
	<body>
		<header><a data-automation="jobstreet" href="/">Jobstreet</a></header>
		<div>
			<article data-automation="normalJob" data-testid="job-card" data-job-id="81234567" aria-label="Product Designer">
				<a data-automation="jobTitle" href="/id/job/81234567?type=standard&amp;ref=search-standalone"
					>Product Designer</a
				>
				<a data-automation="jobCompany" href="#">Lumen Health</a>
				<span data-automation="jobSalary">Rp 15.000.000 – Rp 20.000.000 per month</span>
			</article>
			<article data-automation="normalJob" data-testid="job-card" data-job-id="81234999" aria-label="Service Designer">
				<a data-automation="jobTitle" href="/id/job/81234999">Service Designer</a>
				<a data-automation="jobCompany" href="#">Harbor Rail</a>
			</article>
		</div>
	</body>
</html>
