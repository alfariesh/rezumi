# Phase 03 navigation: the five tabs, a recent document opened from Home, and back to Home.
# Start signed in (run sign-in.yaml first), English UI, phone portrait, with at least one document.
# The Portfolio tab shows only for accounts with portfolios; it is checked when present.
appId: app.rezumi
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 30000
- assertVisible: "Home"
- tapOn:
    id: "tab-documents"
- assertVisible:
    id: "tab-documents"
    selected: true
- tapOn:
    id: "tab-applications"
- assertVisible:
    id: "tab-applications"
    selected: true
- runFlow:
    when:
      visible:
        id: "tab-portfolio"
    commands:
      - tapOn:
          id: "tab-portfolio"
      - extendedWaitUntil:
          visible: "Your portfolio is coming to the app"
          timeout: 10000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Your Profile is coming to the app"
    timeout: 10000
- tapOn:
    id: "tab-home"
- scrollUntilVisible:
    element:
      id: "home-recent-documents"
    direction: DOWN
- tapOn:
    id: "recent-.*"
    index: 0
- extendedWaitUntil:
    notVisible:
      id: "tab-home"
    timeout: 15000
# The builder's own Back (iOS has no system back button; Android's back gesture does the same).
- tapOn: "Back to Documents"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 15000
