    "target/",
    "tests/references/",
    "output.pdf",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A page-native PDF rendering engine. Layout INTO pages, not onto an infinite canvas."
homepage = "https://formepdf.com"
documentation = "https://docs.rs/forme-pdf"
readme = "README.md"
keywords = [
    "pdf",
    "wasm",
    "layout",
    "document",
    "report",
]
categories = [
    "rendering",
    "encoding",
    "wasm",
]
license = "MIT"
repository = "https://github.com/formepdf/forme"

[features]
regex = ["dep:regex"]
