name: Deploy to Cloudflare
run-name: Deploy to Cloudflare · ${{ github.ref_name }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Migrate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Direct (non-pooled) PostgreSQL connection string, used only to apply migrations.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --filter @rezumi/db db:migrate

      - name: Build
        run: pnpm build:cloudflare

      # Cloudflare validates the Worker's startup CPU time on upload and the Worker sits close to the limit, so the
      # same bundle is accepted or rejected (error 10021) from one attempt to the next. Retry only that error; a
      # rejected version is never activated, so production keeps serving the previous one meanwhile.
      - name: Deploy
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm exec wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
              exit 0
            fi
            grep -q "10021" "$RUNNER_TEMP/deploy.log" || exit 1
            echo "::warning::Worker startup CPU limit hit (attempt $attempt of 3)"
            sleep 15
          done
          echo "::error::Worker failed the startup CPU limit validation 3 times"
          exit 1
